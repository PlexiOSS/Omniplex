name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check open issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see this ourselves?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page where you saw this, if applicable.
      placeholder: https://omniplex.gg/bots/example
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - omniplex.gg (production)
        - beta.omniplex.gg
        - reedwhisker.omniplex.gg
        - Local development
        - Not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, browser/OS details, or anything else that might help.
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability. (Report those to security@nodebyte.co.uk instead, see SECURITY.md.)
          required: true
