name: CI

on:
  push:
    branches: [master, development]
    paths-ignore:
      - "packages/sdk-python/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    paths-ignore:
      - "packages/sdk-python/**"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Website and JS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build
