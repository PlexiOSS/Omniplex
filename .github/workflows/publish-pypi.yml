name: Publish Python package

on:
  push:
    tags:
      - "sdk-python@v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME##*@v}"
          actual=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/omniplex/__init__.py').read_text()).group(1))")
          if [ "$actual" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $version but the package is $actual"
            exit 1
          fi

      - run: python -m pip install -e ".[test]" ruff mypy build twine

      - run: ruff check src tests && ruff format --check src tests && mypy src && pytest

      - run: python -m build

      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: packages/sdk-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/omniplex-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
