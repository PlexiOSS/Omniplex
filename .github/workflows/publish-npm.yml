name: Publish npm package

on:
  push:
    tags:
      - "sdk-js@v*"
      - "api-types@v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%@v*}"
          version="${tag##*@v}"
          case "$name" in
            sdk-js|api-types) ;;
            *) echo "::error::Unknown package in tag $tag"; exit 1 ;;
          esac
          dir="packages/$name"
          actual=$(node -p "require('./$dir/package.json').version")
          if [ "$actual" != "$version" ]; then
            echo "::error::Tag $tag says $version but $dir/package.json is $actual"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "filter=$(node -p "require('./$dir/package.json').name")" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: node_modules/.bin/turbo run lint typecheck test build --filter=${{ steps.pkg.outputs.filter }}

      - name: Pack
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: bun pm pack --destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package
          path: pack

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: Publish with trusted publishing
        run: npm publish ./pack/*.tgz --access public --provenance
